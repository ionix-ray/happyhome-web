<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <title>Happy Home Hospital And Rehab | Bhubaneswar | Neuro Rehabilitation Centre</title>
  <meta name="description" content="Happy Home Hospital and Rehab in Bhubaneswar offers expert neuro rehabilitation, stroke recovery, spinal cord injury care and 24/7 critical care. Call +91 8249914673." />
  <link rel="canonical" href="https://happyhomehospital.com/" />
  <link rel="icon" href="https://happyhomehospital.com/wp-content/uploads/2026/05/fav-logo.png" />
  <!-- Preconnect fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/tailwind.min.css" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body class="bg-slate-50 text-slate-900 m-0 p-0">
  <div id="main">
    <div id="app-loading" style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f8fafc; font-family: sans-serif; flex-direction: column;">
      <div style="width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top: 4px solid #36a1d7; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      <h2 style="margin-top: 20px; color: #475569; font-weight: 600;">Happy Home Hospital</h2>
      <p style="color: #94a3b8; font-size: 14px; margin-top: 4px;">Loading...</p>
    </div>
  </div>
  <script>
    (function() {
      function cleanup() {
        var loader = document.getElementById('app-loading');
        if (loader) loader.remove();
      }
      function initScrollObserver() {
        if (!('IntersectionObserver' in window)) {
          document.querySelectorAll('.reveal-init').forEach(function(el) {
            el.classList.add('is-visible');
          });
          return;
        }
        var io = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.01, rootMargin: '200px 0px 200px 0px' });

        function scanElements() {
          var els = document.querySelectorAll('.reveal-init:not(.observed)');
          els.forEach(function(el) {
            el.classList.add('observed');
            io.observe(el);
          });
        }

        scanElements();
        var dynObserver = new MutationObserver(function() {
          scanElements();
        });
        if (document.body) {
          dynObserver.observe(document.body, { childList: true, subtree: true });
        }

        // Failsafe: Ensure all cards become visible within 1.2s
        setTimeout(function() {
          document.querySelectorAll('.reveal-init').forEach(function(el) {
            el.classList.add('is-visible');
          });
        }, 1200);
      }

      function initBioCanvas() {
        var canvas = document.getElementById('bio-canvas');
        if (!canvas || canvas.dataset.initialized) return;
        canvas.dataset.initialized = 'true';
        var ctx = canvas.getContext('2d');
        if (!ctx) return;

        var width = window.innerWidth;
        var height = window.innerHeight;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);

        function resize() {
          width = window.innerWidth;
          height = window.innerHeight;
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener('resize', resize);

        // Biochemical Nucleotides: Authentic biological color palette
        var NUCLEOTIDES = {
          A: { name: 'Adenine',  color: '#10b981', rgba: '16, 185, 129' },   // Emerald Green
          T: { name: 'Thymine',  color: '#f43f5e', rgba: '244, 63, 94' },    // Ruby Coral
          C: { name: 'Cytosine', color: '#06b6d4', rgba: '6, 182, 212' },    // Electric Cyan
          G: { name: 'Guanine',  color: '#8b5cf6', rgba: '139, 92, 246' }    // Royal Amethyst
        };

        // Pointer tracking for interactive neuro-excitation
        var pointer = { x: -1000, y: -1000, active: false, pulseR: 0, pulseMax: 0 };
        function setPointer(e) {
          pointer.x = e.clientX;
          pointer.y = e.clientY;
          pointer.active = true;
        }
        window.addEventListener('mousemove', setPointer);
        window.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches[0]) setPointer(e.touches[0]);
        }, { passive: true });
        window.addEventListener('mouseleave', function() {
          pointer.active = false;
        });

        // Click / Tap excites neuro-genesis ripple wave
        window.addEventListener('click', function(e) {
          pointer.x = e.clientX;
          pointer.y = e.clientY;
          pointer.pulseR = 10;
          pointer.pulseMax = Math.min(width, height) * 0.45;
          triggerLocalMutation(pointer.x, pointer.y);
        });

        // 1. DNA Double Helix Data
        var rungCount = Math.min(52, Math.max(28, Math.floor(width / 32)));
        var basePairs = [];
        var pairTypes = [['A', 'T'], ['T', 'A'], ['C', 'G'], ['G', 'C']];
        for (var p = 0; p < rungCount; p++) {
          var pair = pairTypes[Math.floor(Math.random() * pairTypes.length)];
          basePairs.push({
            typeA: pair[0],
            typeB: pair[1],
            mutating: 0,
            mutationSpeed: 0.024,
            targetA: pair[0],
            targetB: pair[1]
          });
        }

        function triggerLocalMutation(px, py) {
          for (var p = 0; p < basePairs.length; p++) {
            var bp = basePairs[p];
            if (bp.lastX && bp.lastY) {
              var d = Math.hypot(bp.lastX - px, bp.lastY - py);
              if (d < 280) {
                startMutation(p);
              }
            }
          }
        }

        function startMutation(idx) {
          var bp = basePairs[idx];
          if (!bp || bp.mutating > 0) return;
          bp.mutating = 0.01;
          var current = bp.typeA;
          var newTypes = current === 'A' || current === 'T'
            ? (Math.random() > 0.5 ? ['C', 'G'] : ['G', 'C'])
            : (Math.random() > 0.5 ? ['A', 'T'] : ['T', 'A']);
          bp.targetA = newTypes[0];
          bp.targetB = newTypes[1];
        }

        // 2. Neuroscience & Brain Synaptic Network
        var somaCount = Math.min(38, Math.max(20, Math.floor((width + height) / 60)));
        var somaList = [];
        for (var s = 0; s < somaCount; s++) {
          somaList.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.32,
            vy: (Math.random() - 0.5) * 0.32,
            radius: Math.random() * 2.5 + 2.2,
            pulse: Math.random() * 6.28,
            charge: 0,
            color: Math.random() > 0.45 ? '#38bdf8' : '#2dd4bf'
          });
        }

        var actionPotentials = [];
        var sparks = [];
        var time = 0;
        var lastMutationTime = 0;

        function render() {
          if (document.hidden) {
            requestAnimationFrame(render);
            return;
          }

          ctx.clearRect(0, 0, width, height);
          time += 0.014;

          // Expand interactive neuro-genesis click wave
          if (pointer.pulseR > 0 && pointer.pulseR < pointer.pulseMax) {
            pointer.pulseR += 8;
            var waveAlpha = (1 - pointer.pulseR / pointer.pulseMax) * 0.25;
            ctx.beginPath();
            ctx.arc(pointer.x, pointer.y, pointer.pulseR, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(56, 189, 248, ' + waveAlpha + ')';
            ctx.lineWidth = 2;
            ctx.stroke();
          }

          // Periodic random gene mutation event sweep
          if (time - lastMutationTime > 1.6) {
            lastMutationTime = time;
            var randLocus = Math.floor(Math.random() * basePairs.length);
            startMutation(randLocus);
            if (randLocus + 1 < basePairs.length) startMutation(randLocus + 1);
          }

          // ── A. DRAW DIAGONAL DNA DOUBLE HELIX (FROM LEFT-END TO RIGHT-END CORNER) ──
          var startX = -60, startY = -60;
          var endX = width + 60, endY = height + 60;
          var dirX = endX - startX;
          var dirY = endY - startY;
          var diagLen = Math.hypot(dirX, dirY);
          var normX = -dirY / diagLen; // perpendicular unit normal
          var normY = dirX / diagLen;

          var helixRadius = Math.min(52, Math.min(width, height) * 0.052);
          var strand1Points = [];
          var strand2Points = [];

          for (var i = 0; i < basePairs.length; i++) {
            var bp = basePairs[i];
            var prog = i / (basePairs.length - 1);

            // Diagonal point along the corner-to-corner axis
            var diagPtX = startX + prog * dirX;
            var diagPtY = startY + prog * dirY;

            // Organic transverse wave undulation perpendicular to diagonal
            var wave = Math.sin(prog * 7.0 + time * 0.35) * 44;
            var baseX = diagPtX + normX * wave;
            var baseY = diagPtY + normY * wave;

            // Interactive pointer magnetic flex
            if (pointer.active) {
              var dPointer = Math.hypot(baseX - pointer.x, baseY - pointer.y);
              if (dPointer < 200) {
                var pull = (1 - dPointer / 200) * 35;
                baseX += (pointer.x - baseX) * (pull / 200);
                baseY += (pointer.y - baseY) * (pull / 200);
              }
            }

            bp.lastX = baseX;
            bp.lastY = baseY;

            // 3D helical rotation angle
            var angle = prog * Math.PI * 13 + time * 1.7;
            var sinA = Math.sin(angle);
            var cosA = Math.cos(angle);
            var depth = cosA;

            var strandDisp = sinA * helixRadius;
            var x1 = baseX + normX * strandDisp;
            var y1 = baseY + normY * strandDisp;

            var x2 = baseX - normX * strandDisp;
            var y2 = baseY - normY * strandDisp;

            strand1Points.push({ x: x1, y: y1, depth: depth });
            strand2Points.push({ x: x2, y: y2, depth: -depth });

            // Mutation state progression
            if (bp.mutating > 0) {
              bp.mutating += bp.mutationSpeed;
              if (bp.mutating >= 0.5 && bp.typeA !== bp.targetA) {
                bp.typeA = bp.targetA;
                bp.typeB = bp.targetB;
                for (var k = 0; k < 6; k++) {
                  var spAngle = Math.random() * Math.PI * 2;
                  var spSpeed = Math.random() * 2.4 + 1.0;
                  sparks.push({
                    x: baseX,
                    y: baseY,
                    vx: Math.cos(spAngle) * spSpeed,
                    vy: Math.sin(spAngle) * spSpeed,
                    color: NUCLEOTIDES[bp.typeA].color,
                    alpha: 1.0,
                    size: Math.random() * 2.6 + 1.2,
                    decay: 0.028
                  });
                }
              }
              if (bp.mutating >= 1.0) {
                bp.mutating = 0;
              }
            }

            var colA = NUCLEOTIDES[bp.typeA];
            var colB = NUCLEOTIDES[bp.typeB];

            var depthAlpha = 0.25 + (depth + 1) * 0.28;
            if (bp.mutating > 0) {
              depthAlpha = Math.min(1.0, depthAlpha + Math.sin(bp.mutating * Math.PI) * 0.65);
            }

            var midX = (x1 + x2) / 2;
            var midY = (y1 + y2) / 2;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(midX, midY);
            ctx.strokeStyle = 'rgba(' + colA.rgba + ', ' + depthAlpha + ')';
            ctx.lineWidth = bp.mutating > 0 ? 2.6 : (depth > 0 ? 1.8 : 1.1);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(midX, midY);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = 'rgba(' + colB.rgba + ', ' + depthAlpha + ')';
            ctx.lineWidth = bp.mutating > 0 ? 2.6 : (depth > 0 ? 1.8 : 1.1);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(midX, midY, bp.mutating > 0 ? 3.4 : 1.6, 0, Math.PI * 2);
            ctx.fillStyle = bp.mutating > 0 ? '#fbbf24' : 'rgba(255, 255, 255, ' + depthAlpha + ')';
            ctx.fill();

            var beadR = depth > 0 ? 3.2 : 2.0;
            ctx.beginPath();
            ctx.arc(x1, y1, beadR, 0, Math.PI * 2);
            ctx.fillStyle = colA.color;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x2, y2, beadR, 0, Math.PI * 2);
            ctx.fillStyle = colB.color;
            ctx.fill();
          }

          function drawStrand(pts, strokeCol) {
            if (pts.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (var p = 1; p < pts.length; p++) {
              var xc = (pts[p].x + pts[p - 1].x) / 2;
              var yc = (pts[p].y + pts[p - 1].y) / 2;
              ctx.quadraticCurveTo(pts[p - 1].x, pts[p - 1].y, xc, yc);
            }
            ctx.strokeStyle = strokeCol;
            ctx.lineWidth = 1.4;
            ctx.stroke();
          }
          drawStrand(strand1Points, 'rgba(56, 189, 248, 0.35)');
          drawStrand(strand2Points, 'rgba(45, 143, 123, 0.35)');

          // ── B. DRAW NEUROSCIENCE & BRAIN SYNAPTIC NETWORK FUSION ──
          for (var s = 0; s < somaList.length; s++) {
            var n = somaList[s];
            n.x += n.vx;
            n.y += n.vy;
            if (n.x < 0 || n.x > width) n.vx *= -1;
            if (n.y < 0 || n.y > height) n.vy *= -1;

            if (pointer.active) {
              var dPtr = Math.hypot(n.x - pointer.x, n.y - pointer.y);
              if (dPtr < 170) {
                var bridgeAlpha = (1 - dPtr / 170) * 0.55;
                ctx.beginPath();
                ctx.moveTo(n.x, n.y);
                ctx.lineTo(pointer.x, pointer.y);
                ctx.strokeStyle = 'rgba(56, 189, 248, ' + bridgeAlpha + ')';
                ctx.lineWidth = 1.0;
                ctx.stroke();
                n.charge = Math.min(1.0, n.charge + 0.08);
              }
            }
            if (n.charge > 0) n.charge -= 0.02;

            // Connect nearby neurons with axons
            for (var s2 = s + 1; s2 < somaList.length; s2++) {
              var n2 = somaList[s2];
              var dx = n.x - n2.x;
              var dy = n.y - n2.y;
              var dist = Math.hypot(dx, dy);

              if (dist < 150) {
                var alpha = (1 - dist / 150) * 0.22;
                if (n.charge > 0 || n2.charge > 0) alpha += 0.25;

                ctx.beginPath();
                ctx.moveTo(n.x, n.y);
                ctx.lineTo(n2.x, n2.y);
                ctx.strokeStyle = 'rgba(56, 189, 248, ' + alpha + ')';
                ctx.lineWidth = 0.9;
                ctx.stroke();

                if (Math.random() < 0.003 && actionPotentials.length < 24) {
                  actionPotentials.push({
                    x1: n.x, y1: n.y,
                    x2: n2.x, y2: n2.y,
                    t: 0,
                    speed: Math.random() * 0.025 + 0.02,
                    color: Math.random() > 0.4 ? '#38bdf8' : '#f59e0b'
                  });
                }
              }
            }

            // Brain-Gene Synaptic Bridges: Connect nearby neurons to diagonal DNA strand
            if (s % 2 === 0 && basePairs.length > 0) {
              var locusIdx = Math.floor((n.x / width) * basePairs.length);
              locusIdx = Math.max(0, Math.min(basePairs.length - 1, locusIdx));
              var locus = basePairs[locusIdx];
              if (locus && locus.lastX) {
                var dLocus = Math.hypot(n.x - locus.lastX, n.y - locus.lastY);
                if (dLocus < 190) {
                  var synapseAlpha = (1 - dLocus / 190) * 0.26;
                  ctx.beginPath();
                  ctx.moveTo(n.x, n.y);
                  ctx.lineTo(locus.lastX, locus.lastY);
                  ctx.strokeStyle = 'rgba(45, 143, 123, ' + synapseAlpha + ')';
                  ctx.lineWidth = 0.8;
                  ctx.setLineDash([3, 3]);
                  ctx.stroke();
                  ctx.setLineDash([]);

                  // Launch neuro-genetic action potential jump to DNA
                  if (Math.random() < 0.005 && actionPotentials.length < 24) {
                    actionPotentials.push({
                      x1: n.x, y1: n.y,
                      x2: locus.lastX, y2: locus.lastY,
                      t: 0,
                      speed: Math.random() * 0.03 + 0.02,
                      color: '#fbbf24',
                      isDnaTarget: true,
                      targetLocus: locusIdx
                    });
                  }
                }
              }
            }

            // Brain dendritic micro-arbor branches
            ctx.beginPath();
            for (var b = 0; b < 3; b++) {
              var branchA = n.pulse + (b * Math.PI * 2) / 3;
              var bLen = n.radius * 2.2;
              ctx.moveTo(n.x, n.y);
              ctx.lineTo(n.x + Math.cos(branchA) * bLen, n.y + Math.sin(branchA) * bLen);
            }
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.22)';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            // Soma cell body
            var somaPulse = Math.sin(time * 2 + n.pulse) * 0.6;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.radius + somaPulse + n.charge * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = n.charge > 0.2 ? '#f59e0b' : n.color;
            ctx.globalAlpha = 0.55;
            ctx.fill();
            ctx.globalAlpha = 1.0;
          }

          // ── C. RENDER ACTION POTENTIAL IMPULSES ──
          for (var a = actionPotentials.length - 1; a >= 0; a--) {
            var ap = actionPotentials[a];
            ap.t += ap.speed;
            if (ap.t >= 1) {
              if (ap.isDnaTarget && ap.targetLocus !== undefined) {
                startMutation(ap.targetLocus);
              }
              actionPotentials.splice(a, 1);
              continue;
            }
            var apx = ap.x1 + (ap.x2 - ap.x1) * ap.t;
            var apy = ap.y1 + (ap.y2 - ap.y1) * ap.t;

            ctx.beginPath();
            ctx.arc(apx, apy, 2.2, 0, Math.PI * 2);
            ctx.fillStyle = ap.color;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(apx, apy, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(245, 158, 11, 0.25)';
            ctx.fill();
          }

          // ── D. RENDER MUTATION QUANTUM BIO-SPARKS ──
          for (var sp = sparks.length - 1; sp >= 0; sp--) {
            var spark = sparks[sp];
            spark.x += spark.vx;
            spark.y += spark.vy;
            spark.vx *= 0.96;
            spark.vy *= 0.96;
            spark.alpha -= spark.decay;

            if (spark.alpha <= 0) {
              sparks.splice(sp, 1);
              continue;
            }

            ctx.beginPath();
            ctx.arc(spark.x, spark.y, spark.size, 0, Math.PI * 2);
            ctx.fillStyle = spark.color;
            ctx.globalAlpha = spark.alpha;
            ctx.fill();
            ctx.globalAlpha = 1.0;
          }

          requestAnimationFrame(render);
        }
        render();
      }

      function initCounters() {
        if (!('IntersectionObserver' in window)) return;
        var counterObserver = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              var el = entry.target;
              if (el.dataset.animated) return;
              el.dataset.animated = 'true';
              var target = parseFloat(el.dataset.target);
              var suffix = el.dataset.suffix || '';
              if (isNaN(target)) return;

              var isFloat = target % 1 !== 0;
              var duration = 1600;
              var start = target > 1900 ? 1980 : 0;
              var startTime = null;

              function step(timestamp) {
                if (!startTime) startTime = timestamp;
                var progress = Math.min((timestamp - startTime) / duration, 1);
                var ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                var current = start + (target - start) * ease;
                el.innerText = (isFloat ? current.toFixed(1) : Math.floor(current)) + suffix;
                if (progress < 1) {
                  requestAnimationFrame(step);
                } else {
                  el.innerText = (isFloat ? target.toFixed(1) : target) + suffix;
                }
              }
              requestAnimationFrame(step);
              counterObserver.unobserve(el);
            }
          });
        }, { threshold: 0.1 });

        function scanCounters() {
          document.querySelectorAll('.dynamic-counter:not([data-bound])').forEach(function(el) {
            el.setAttribute('data-bound', 'true');
            counterObserver.observe(el);
          });
        }
        scanCounters();
        var dynObserver = new MutationObserver(scanCounters);
        if (document.body) dynObserver.observe(document.body, { childList: true, subtree: true });
      }

      function setupInteractive() {
        initScrollObserver();
        initBioCanvas();
        initCounters();
      }

      var observer = new MutationObserver(function() {
        if (document.getElementById('app')) {
          cleanup();
          setupInteractive();
          observer.disconnect();
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('DOMContentLoaded', function() {
        if (document.getElementById('app')) {
          cleanup();
          setupInteractive();
        }
      });
    })();
  </script>
</body>
</html>
