  <script>
    (function() {
      function syncTheme() {
        const app = document.getElementById('app');
        const theme = app ? app.getAttribute('data-theme') : (document.documentElement.getAttribute('data-theme') || 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      }

      function initScrollReveals() {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('peaked');
              observer.unobserve(entry.target);
            }
          });
        }, {
          rootMargin: '0px 0px -40px 0px',
          threshold: 0.08
        });

        function observeElements() {
          const targets = document.querySelectorAll(
            '.peak-in-up:not(.peaked), .peak-in-left:not(.peaked), .peak-in-right:not(.peaked), .peak-in-down:not(.peaked), .peak-in-scale:not(.peaked)'
          );
          targets.forEach(el => {
            const rect = el.getBoundingClientRect();
            if (rect.top <= window.innerHeight - 30) {
              el.classList.add('peaked');
            } else {
              observer.observe(el);
            }
          });
        }

        observeElements();

        // Re-scan when Dioxus updates components or route switches
        const domObserver = new MutationObserver(() => {
          observeElements();
        });
        domObserver.observe(document.body || document.documentElement, { childList: true, subtree: true });

        window.addEventListener('scroll', () => {
          const unrevealed = document.querySelectorAll(
            '.peak-in-up:not(.peaked), .peak-in-left:not(.peaked), .peak-in-right:not(.peaked), .peak-in-down:not(.peaked), .peak-in-scale:not(.peaked)'
          );
          unrevealed.forEach(el => {
            const rect = el.getBoundingClientRect();
            if (rect.top <= window.innerHeight - 20) {
              el.classList.add('peaked');
            }
          });
        }, { passive: true });
      }

      window.addEventListener('DOMContentLoaded', () => {
        syncTheme();
        initScrollReveals();
        const obs = new MutationObserver(syncTheme);
        obs.observe(document.documentElement, { attributes: true, subtree: true, attributeFilter: ['data-theme', 'class'] });
      });
    })();
  </script>
