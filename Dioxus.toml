[application]
name = "happyhome"
default_platform = "web"
asset_dir = "assets"

[web.app]
title = "Happy Home Hospital And Rehab | Bhubaneswar | Neuro Rehabilitation Centre"

[web.watcher]
reload_html = true
watch_path = ["src", "assets", "config"]

[web]
pre_compress = true

[web.wasm_opt]
level = "z"
debug = false
keep_names = false

[web.resource]
style = []
script = []

[web.resource.dev]
style = []
script = []


