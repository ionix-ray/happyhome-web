question = "Do you accept health insurance and TPA claims?"
answer = "Yes. We assist with cashless insurance claims through leading Third Party Administrators (TPAs) and provide comprehensive documentation for private and public reimbursement policies."

[[hospital.faqs]]
question = "What emergency diagnostic facilities are available on-site?"
answer = "Our on-site diagnostic center offers 24/7 pathology lab tests, digital X-rays, bedside ultrasound, ECG, and arterial blood gas (ABG) analysis with rapid turnaround times."

