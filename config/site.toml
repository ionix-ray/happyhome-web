[[rehab.faqs]]
question = "What conditions are eligible for inpatient rehabilitation?"
answer = "We specialize in patients recovering from stroke, traumatic brain injuries, neurosurgeries, spinal trauma, prolonged ICU stays, cancer palliative care, and severe chronic wounds requiring 24/7 medical supervision."

[[rehab.faqs]]
question = "What is the typical length of stay in the rehabilitation center?"
answer = "Lengths of stay range from 2 weeks for acute post-surgical rehab to 6 to 12 weeks for complex stroke recovery or traumatic spinal cord rehabilitation, based on multi-disciplinary weekly assessments."

[[rehab.faqs]]
question = "Can family members or attendants stay with the patient?"
answer = "Yes. We provide comfortable private and semi-private rooms equipped with dedicated attendant beds, attached bathrooms, and meal facilities to ensure family members are actively involved in the recovery process."

[[rehab.faqs]]
question = "Do you have ICU backup for emergencies?"
answer = "Yes. Our facility features High Dependency Unit (HDU) and step-down critical care infrastructure with central oxygen lines, multipara cardiac monitors, defibrillators, and emergency crash carts on standby."

[[rehab.faqs]]
question = "How do we arrange for patient admission or transfer?"
answer = "You can call our 24/7 admissions helpline at +91 8249914673. We coordinate inter-hospital ambulance transfers with oxygen and ventilator support throughout Odisha and neighboring states."

