[package]
name = "happyhome"
version = "0.1.0"
edition = "2021"

[dependencies]
console_error_panic_hook = "0.1.7"
dioxus = { version = "=0.7.9", features = ["web"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
opt-level = 1
debug = false
split-debuginfo = "unpacked"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = false
